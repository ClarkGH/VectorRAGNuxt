# Dependabot version updates. Security alerts and security updates are switched on
# separately, in the repo's Settings → Code security.
version: 2
updates:
  - package-ecosystem: "npm" # covers pnpm-lock.yaml too
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Skip versions until they've been out a few days, so a hijacked release is
    # usually caught and pulled before it reaches us.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # One PR for every minor and patch update; majors get their own PRs, since
    # those are the ones that break things.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    # TypeScript 7 (the rewritten compiler) breaks lint and typecheck: typescript-eslint
    # doesn't support it yet, and vue-tsc (nuxt typecheck) can't find tsc in it.
    # Checked 2026-11-25 on Dependabot's 7.0.2 PR. Remove this once both support 7.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: "deps"
